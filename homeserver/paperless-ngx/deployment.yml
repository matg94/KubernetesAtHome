apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-ngx
  namespace: paperless-ngx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paperless-ngx
  template:
    metadata:
      labels:
        app: paperless-ngx
    spec:
      containers:
      - name: paperless-ngx
        image: ghcr.io/paperless-ngx/paperless-ngx:latest
        ports:
        - containerPort: 8000
        env:
        - name: PAPERLESS_REDIS
          value: "redis://redis:6379"
        - name: PAPERLESS_DBHOST
        - name: PAPERLESS_TIKA_ENABLED
          value: "1"
        - name: PAPERLESS_TIKA_GOTENBERG_ENDPOINT
          value: "http://gotenberg:3000"
        - name: PAPERLESS_TIKA_ENDPOINT
          value: "http://tika:9998"
        - name: PAPERLESS_TIME_ZONE
          value: "America/Toronto"
        - name: PAPERLESS_OCR_LANGUAGE
          value: "eng"
        - name: PAPERLESS_URL
          value: "http://paperless.cluster.local"
        - name: PAPERLESS_SECRET_KEY
          value: "change-me-to-a-random-string"
        - name: PAPERLESS_ADMIN_USER
          value: "admin"
        - name: PAPERLESS_ADMIN_PASSWORD
          value: "admin"
        - name: PAPERLESS_CONSUMER_DELETE_DUPLICATES
          value: "true"
        - name: PAPERLESS_CONSUMER_RECURSIVE
          value: "true"
        - name: PAPERLESS_OCR_USER_ARGS
          value: '{"continue_on_soft_render_error": true}'
        - name: PAPERLESS_FILENAME_FORMAT
          value: "{created_year}/{correspondent}/{title}"
        - name: PAPERLESS_CONSUMER_ENABLE_BARCODES
          value: "true"
        - name: PAPERLESS_CONSUMER_ENABLE_ASN_BARCODE
          value: "true"
        volumeMounts:
        - name: data
          mountPath: /usr/src/paperless/data
        - name: media
          mountPath: /usr/src/paperless/media
        - name: consume
          mountPath: /usr/src/paperless/consume
        - name: export
          mountPath: /usr/src/paperless/export
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: paperless-data-pvc
      - name: media
        persistentVolumeClaim:
          claimName: paperless-media-pvc
      - name: consume
        persistentVolumeClaim:
          claimName: paperless-consume-pvc
      - name: export
        persistentVolumeClaim:
          claimName: paperless-export-pvc
