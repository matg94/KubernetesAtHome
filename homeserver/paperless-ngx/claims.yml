apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-data-pvc
  namespace: paperless-ngx
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ssd-storage
  resources:
    requests:
      storage: 10Gi
---
